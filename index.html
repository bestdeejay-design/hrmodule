  <!-- Landing Page -->
  <div id="landing" class="page">
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
      <svg class="icon"><use href="#icon-sun"/></svg>
    </button>
    
    <div class="hero">
      <div class="logo">
        <svg class="icon-lg"><use href="#icon-trophy"/></svg>
      </div>
      <h1>HR Motivation</h1>
      <p class="tagline">Бонусы, уровни и рейтинги</p>
      <p class="desc">Корпоративная система мотивации: баллы, геймификация, топы сотрудников и витрина бонусов</p>
      
      <div class="features">
        <div class="feature">
          <svg class="icon"><use href="#icon-lightning"/></svg>
          <span>Баллы</span>
        </div>
        <div class="feature">
          <svg class="icon"><use href="#icon-level"/></svg>
          <span>Уровни</span>
        </div>
        <div class="feature">
          <svg class="icon"><use href="#icon-medal"/></svg>
          <span>Бейджи</span>
        </div>
        <div class="feature">
          <svg class="icon"><use href="#icon-gift"/></svg>
          <span>Бонусы</span>
        </div>
      </div>
      
      <button class="btn-primary" onclick="openApp()">
        Open Demo
        <svg class="icon"><use href="#icon-arrow"/></svg>
      </button>
      
      <p class="note">This is a demo prototype &bull; Works offline</p>
    </div>
  </div>

  <!-- Mobile App -->
  <div id="app" class="page hidden">
    <div class="phone-frame">
      <div class="phone-header">
        <span class="status-bar"></span>
        <button class="theme-toggle-small" onclick="toggleTheme()">
          <svg class="icon-sm"><use href="#icon-sun"/></svg>
        </button>
      </div>
      
      <div class="app-header">
        <button class="back-btn hidden" onclick="goBack()" id="backBtn">
          <svg class="icon"><use href="#icon-arrow-left"/></svg>
        </button>
        <h2 id="appTitle">Home</h2>
        <div class="header-actions">
          <div class="profile-icon" onclick="showPage('profile')">
            <svg class="icon"><use href="#icon-user"/></svg>
          </div>
        </div>
      </div>
      
      <div class="app-content" id="content">
        <!-- Content injected by JS -->
      </div>
      
      <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" onclick="showPage('home', this)">
          <svg class="icon-nav"><use href="#icon-home"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" onclick="showPage('tasks', this)">
          <svg class="icon-nav"><use href="#icon-task"/></svg>
          <span>Tasks</span>
        </button>
        <button class="nav-item" onclick="showPage('leaders', this)">
          <svg class="icon-nav"><use href="#icon-medal"/></svg>
          <span>Leaders</span>
        </button>
        <button class="nav-item" onclick="showPage('shop', this)">
          <svg class="icon-nav"><use href="#icon-gift"/></svg>
          <span>Shop</span>
        </button>
        <button class="nav-item" onclick="showPage('profile', this)">
          <svg class="icon-nav"><use href="#icon-user"/></svg>
          <span>Profile</span>
        </button>
      </div>
    </div>
    
    <button class="btn-exit" onclick="closeApp()">Back to Home</button>
  </div>
